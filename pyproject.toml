[project]
name = "datasleuth-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AKASH KARMAKAR", email = "akashkarmakar10022003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agent>=0.1.3",
    "google-genai>=2.30.1",
    "google-generativeai>=0.8.6",
    "groq>=0.37.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "profiler>=0.1.0",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
    "streamlit>=1.65.0",
    "svglib>=2.3.0",
    "tabulate>=0.10.0",
]

[project.scripts]
datasleuth-project = "datasleuth_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
